version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - exptostd
    - forcetypeassert
    - gocritic
    - iface
    - intrange
    - makezero
    - mirror
    - modernize
    - perfsprint
    - predeclared
    - testifylint
    - unconvert
    - usetesting
    - wastedassign
